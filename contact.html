<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Pregnancy Week Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --primary: #be185d;
            --primary-dark: #9d174d;
            --bg: #fdf4f7;
            --text: #111827;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 { font-family: 'Outfit', sans-serif; color: var(--primary); }
        .back-link { display: inline-block; margin-bottom: 20px; font-weight: 600; text-decoration: none; color: var(--primary); }
        .email-box {
            background: var(--bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
        }
        .email-link { font-size: 1.2rem; font-weight: 700; color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Tracker</a>
        <h1>Contact Us</h1>
        <p>Have a question, feedback, or found a bug? We'd love to hear from you!</p>
        <div class="email-box">
            <p>Email us at:</p>
            <a href="mailto:hello@pregnancyweektracker.com" class="email-link">hello@pregnancyweektracker.com</a>
        </div>
        <p style="margin-top: 30px; font-size: 0.9rem; color: #666;">We aim to respond to all inquiries within 48 hours.</p>
    </div>
</body>
</html>
