name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean _site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'docs/' \
            --exclude 'assets/alternativeto/' \
            --exclude 'assets/fruits/' \
            --exclude 'assets/growth-stages/' \
            --exclude 'assets/logo/' \
            --exclude 'scratch/' \
            --exclude '*.py' \
            --exclude '*.ps1' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'temp_build.js' \
            --exclude 'DEPLOY.md' \
            --exclude 'README.md' \
            --exclude '*.md' \
            --exclude '.markdownlintignore' \
            ./ _site/
          test -f CNAME && cp CNAME _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
